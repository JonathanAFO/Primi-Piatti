<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Primi Piatti - Marmitex Delivery</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-content">
      <h1 class="logo">Primi Piatti</h1>
      <p class="tagline">Marmitas Pronta-Entrega</p>
    </div>
    <button class="cart-btn" onclick="goToCart()">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="9" cy="21" r="1"></circle>
        <circle cx="20" cy="21" r="1"></circle>
        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
      </svg>
      <span class="cart-count" id="cartCount">0</span>
    </button>
  </header>

  <!-- Banner -->
  <section class="banner">
    <div class="banner-content">
      <span class="banner-badge">Especiais do dia</span>
    </div>
  </section>

  <!-- Categories -->
  <nav class="categories">
    <button class="category-btn active" data-category="all">Todos</button>
    <button class="category-btn" data-category="carnes">Carnes</button>
    <button class="category-btn" data-category="frango">Frango</button>
    <button class="category-btn" data-category="peixes">Peixes</button>
    <button class="category-btn" data-category="vegetariano">Veggie</button>
  </nav>

  <!-- Products Grid -->
  <main class="products-container">
    <section class="products-section">
      <h2 class="section-title">Especiais do dia</h2>
      <div class="products-grid" id="specialsGrid"></div>
    </section>

    <section class="products-section">
      <h2 class="section-title">Carnes</h2>
      <div class="products-grid" id="carnesGrid"></div>
    </section>

    <section class="products-section">
      <h2 class="section-title">Frango</h2>
      <div class="products-grid" id="frangoGrid"></div>
    </section>

    <section class="products-section">
      <h2 class="section-title">Peixes</h2>
      <div class="products-grid" id="peixesGrid"></div>
    </section>

    <section class="products-section">
      <h2 class="section-title">Vegetariano</h2>
      <div class="products-grid" id="vegetarianoGrid"></div>
    </section>
  </main>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item active">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
      </svg>
      <span>Inicio</span>
    </a>
    <a href="cart.html" class="nav-item">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="9" cy="21" r="1"></circle>
        <circle cx="20" cy="21" r="1"></circle>
        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
      </svg>
      <span>Carrinho</span>
    </a>
    <a href="admin/index.html" class="nav-item">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 20h9"></path>
        <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
      </svg>
      <span>Admin</span>
    </a>
  </nav>

  <!-- Product Modal -->
  <div class="modal-overlay" id="productModal">
    <div class="modal">
      <button class="modal-close" onclick="closeModal()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
      
      <div class="modal-image" id="modalImage"></div>
      
      <div class="modal-content">
        <h2 class="modal-title" id="modalTitle">Nome do Produto</h2>
        <p class="modal-description" id="modalDescription">Personalize seu pedido escolhendo as guarnições</p>
        
        <div class="modal-section">
          <h3 class="modal-section-title">Escolha uma das guarnições</h3>
          <p class="modal-section-subtitle">Obrigatório</p>
          <div class="garnish-options" id="garnishOptions"></div>
        </div>

        <div class="modal-section">
          <h3 class="modal-section-title">Observações (Opcional)</h3>
          <textarea class="observations-input" id="observations" placeholder="Ex: Sem cebola, pouco sal..."></textarea>
        </div>

        <div class="modal-section">
          <label class="checkbox-container">
            <input type="checkbox" id="needsCutlery" onchange="toggleCutleryQty()">
            <span class="checkmark"></span>
            Preciso de Talheres
          </label>
          <div class="cutlery-qty" id="cutleryQtyContainer" style="display: none;">
            <span>Quantidade:</span>
            <div class="qty-controls">
              <button class="qty-btn" onclick="changeCutleryQty(-1)">-</button>
              <span id="cutleryQty">1</span>
              <button class="qty-btn" onclick="changeCutleryQty(1)">+</button>
            </div>
          </div>
        </div>

        <div class="modal-footer">
          <div class="quantity-selector">
            <button class="qty-btn" onclick="changeQuantity(-1)">-</button>
            <span id="quantity">1</span>
            <button class="qty-btn" onclick="changeQuantity(1)">+</button>
          </div>
          <button class="add-to-cart-btn" id="addToCartBtn" onclick="addToCart()">
            Adicionar ao carrinho R$ <span id="totalPrice">0,00</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
</body>
</html>
